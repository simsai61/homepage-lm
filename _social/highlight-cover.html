<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family:'IBM Plex Mono'; font-weight:500; src:url(../assets/fonts/ibm-plex-mono-500-latin.woff2) format('woff2'); }
  *{margin:0;padding:0;box-sizing:border-box}
  /* Instagram schneidet Highlight-Cover kreisrund aus einem 1080x1920-Bild.
     Motiv daher exakt in die Bildmitte, großzügiger Rand ringsum. */
  html,body{width:1080px;height:1920px;overflow:hidden;background:#14171F}
  #c{position:relative;width:1080px;height:1920px;display:flex;align-items:center;justify-content:center}
  .glow{position:absolute;width:820px;height:820px;border-radius:50%;filter:blur(150px);opacity:.28}
  #g1{background:#E8628F;left:-160px;top:400px}
  #g2{background:#F2A65A;right:-180px;top:700px}
  .safe{position:relative;width:700px;height:700px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px}
  .ico{width:340px;height:340px;color:#F2A65A;filter:drop-shadow(0 0 46px rgba(242,166,90,.45))}
  .ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .ico svg.solid{fill:currentColor;stroke:none}
  .lbl{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:48px;letter-spacing:.2em;
    text-transform:uppercase;color:#F2F1EA;text-align:center;line-height:1.3}
</style>
</head>
<body>
<div id="c">
  <div class="glow" id="g1"></div><div class="glow" id="g2"></div>
  <div class="safe">
    <div class="ico" id="ico"></div>
    <div class="lbl" id="lbl"></div>
  </div>
</div>
<script>
const ICONS={
  leuchtreklame:['<svg viewBox="0 0 24 24"><path d="M4 4h16v9H4z"/><path d="M8 13v7"/><path d="M16 13v7"/><path d="M7.5 8h9"/><path d="M12 2v2"/></svg>','Leucht-<br>reklame'],
  referenzen:['<svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M4 21V10l5 3V10l5 3V7l6 4v10"/><path d="M7 21v-3.5"/><path d="M12 21v-3.5"/><path d="M17 21v-3.5"/></svg>','Referenzen'],
  zeitplaner:['<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>','Zeitplaner'],
  anfrage:['<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.6 8.6 0 01-4-1L3 21l2.1-5a8.4 8.4 0 01-1-4 8.4 8.4 0 018.4-8.4 8.4 8.4 0 018.5 8.4z"/></svg>','Anfrage'],
  logo:['<svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.6 7.6"/><circle cx="11" cy="11" r="2"/></svg>','Logo &amp;<br>Grafik'],
  fahrzeuge:['<svg viewBox="0 0 24 24"><path d="M3 13l2-6h14l2 6v5h-3M6 18H3v-5"/><circle cx="7.5" cy="18" r="2"/><circle cx="16.5" cy="18" r="2"/><path d="M9.5 18h5"/></svg>','Fahrzeuge'],
  workwear:['<svg viewBox="0 0 24 24"><path d="M9 3l3 2 3-2 5 3-2 4-2-1v10H8V9L6 10 4 6z"/></svg>','Workwear'],
  team:['<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>','Das Team'],
  bewertungen:['<svg class="solid" viewBox="0 0 24 24"><path d="M12 2l2.9 6.2 6.6.8-4.9 4.6 1.3 6.5L12 16.9 6.1 20.1l1.3-6.5L2.5 9l6.6-.8z"/></svg>','5,0 bei<br>Google'],
  blitz:['<svg class="solid" viewBox="99.45 71.64 16.05 26.59"><path d="M100.45,87.38l6.1-.91-2.9,10.76,10.85-16.08-7.32,1.09,2.07-9.61-8.8,14.74Z"/></svg>','Seit 2018']
};
const k=new URLSearchParams(location.search).get('i')||'leuchtreklame';
document.getElementById('ico').innerHTML=ICONS[k][0];
document.getElementById('lbl').innerHTML=ICONS[k][1];
window.ready=true;
</script>
</body>
</html>
