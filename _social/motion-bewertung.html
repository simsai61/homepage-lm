<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family:'Space Grotesk'; font-weight:700; src:url(../assets/fonts/space-grotesk-700-latin.woff2) format('woff2'); }
  @font-face { font-family:'Space Grotesk'; font-weight:600; src:url(../assets/fonts/space-grotesk-600-latin.woff2) format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:400; src:url(../assets/fonts/inter-400-latin.woff2) format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:600; src:url(../assets/fonts/inter-600-latin.woff2) format('woff2'); }
  @font-face { font-family:'IBM Plex Mono'; font-weight:500; src:url(../assets/fonts/ibm-plex-mono-500-latin.woff2) format('woff2'); }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:540px;height:960px;overflow:hidden;background:#14171F}
  #stage{position:relative;width:540px;height:960px;overflow:hidden;font-family:'Inter',sans-serif}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
  #b1{width:520px;height:520px;background:#E8628F}
  #b2{width:460px;height:460px;background:#F2A65A}
  #b3{width:420px;height:420px;background:#C93C77}
  #dim{position:absolute;inset:0;background:rgba(20,23,31,.55)}
  .layer{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:0}

  #jahr{gap:18px}
  #jahr .bolt{width:80px;color:#F2A65A;filter:drop-shadow(0 0 28px rgba(242,166,90,.6))}
  #jahr h1{font-family:'Space Grotesk';font-weight:700;font-size:74px;letter-spacing:-.02em;color:#F2F1EA}
  #jahr h1 em{font-style:normal;color:#F2A65A}
  #jahr .sub{font-size:22px;color:#C9CCD6}

  #sterne{gap:26px}
  #sterne .row{display:flex;gap:14px}
  #sterne .st{width:64px;height:64px;opacity:0;transform:scale(.3)}
  #sterne .st svg{width:100%;height:100%;fill:#F2A65A;filter:drop-shadow(0 0 18px rgba(242,166,90,.55))}
  #sterne .wert{font-family:'Space Grotesk';font-weight:700;font-size:96px;letter-spacing:-.03em;color:#F2F1EA;line-height:1}
  #sterne .quelle{font-family:'IBM Plex Mono';font-weight:500;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:#8A8F9E}
  #sterne .quelle b{color:#F2F1EA;font-weight:500}
  #sterne .seit{margin-top:8px;font-size:21px;color:#C9CCD6}
  #sterne .seit b{color:#F2A65A;font-weight:600}

  #danke{gap:24px}
  #danke h2{font-family:'Space Grotesk';font-weight:700;font-size:52px;letter-spacing:-.02em;color:#F2F1EA;text-align:center;line-height:1.15;width:460px}
  #danke h2 em{font-style:normal;color:#F2A65A}
  #danke .logo{width:300px;color:#F2F1EA;filter:drop-shadow(0 0 26px rgba(232,98,143,.35));margin-top:8px}
  #danke .claim{font-family:'IBM Plex Mono';font-weight:500;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:#F2A65A}
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div>
  <div id="dim"></div>

  <div class="layer" id="jahr">
    <svg class="bolt" viewBox="99.45 71.64 16.05 26.59" fill="currentColor" fill-rule="evenodd"><path d="M100.45,87.38l6.1-.91-2.9,10.76,10.85-16.08-7.32,1.09,2.07-9.61-8.8,14.74Z"/></svg>
    <h1>Seit <em>2018</em>.</h1>
    <div class="sub">Werbetechnik aus Vorarlberg.</div>
  </div>

  <div class="layer" id="sterne">
    <div class="row" id="row"></div>
    <div class="wert" id="wert">0,0</div>
    <div class="quelle">bei <b>20 Bewertungen</b> · Google</div>
    <div class="seit" id="seit">Gewachsen seit <b>2018</b> — Projekt für Projekt.</div>
  </div>

  <div class="layer" id="danke">
    <h2>Danke, <em>Vorarlberg</em>.</h2>
    <svg class="logo" viewBox="0 0 324.66 97.23" id="finLogo"></svg>
    <div class="claim">Wer nicht wirbt, stirbt.</div>
  </div>
</div>

<script>
const $=q=>document.querySelector(q);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+ (c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);

const row=$('#row');
for(let i=0;i<5;i++){
  const d=document.createElement('div'); d.className='st';
  d.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.2 6.6.8-4.9 4.6 1.3 6.5L12 16.9 6.1 20.1l1.3-6.5L2.5 9l6.6-.8z"/></svg>';
  row.appendChild(d);
}

fetch('../assets/logo.svg').then(r=>r.text()).then(s=>{
  const doc=new DOMParser().parseFromString(s,'image/svg+xml').documentElement;
  const svg=$('#finLogo'); svg.innerHTML=doc.innerHTML;
  [...doc.attributes].forEach(a=>{ if(a.name!=='width'&&a.name!=='height') svg.setAttribute(a.name,a.value); });
  svg.style.color='#F2F1EA';
  window.logoReady=true;
});
window.imgsReady=true;

const SC={jahr:[0,2.6], sterne:[2.6,7.6], danke:[7.6,10.6]};

function render(t){
  const b1=$('#b1'),b2=$('#b2'),b3=$('#b3');
  b1.style.left=(-140+40*Math.sin(t*.5))+'px'; b1.style.top=(-120+60*Math.cos(t*.4))+'px';
  b2.style.right=(-120+50*Math.cos(t*.45))+'px'; b2.style.bottom=(-100+45*Math.sin(t*.55))+'px';
  b2.style.left='auto'; b2.style.top='auto';
  b3.style.left=(160+70*Math.sin(t*.3+2))+'px'; b3.style.top=(430+50*Math.cos(t*.35+1))+'px';

  /* 1: Seit 2018 */
  const jahr=$('#jahr');
  jahr.style.opacity = ease(seg(t,.1,.5)) * (t<SC.jahr[1]-.4?1:1-ease(seg(t,SC.jahr[1]-.4,SC.jahr[1])));
  jahr.style.transform=`scale(${1+.02*t})`;
  const bp=ease(seg(t,.1,.6));
  $('#jahr .bolt').style.transform=`translateY(${-160*(1-bp)}px)`;

  /* 2: Sterne poppen, Wert zählt */
  const st=$('#sterne');
  st.style.opacity = ease(seg(t,SC.sterne[0],SC.sterne[0]+.4)) * (t<SC.sterne[1]-.4?1:1-ease(seg(t,SC.sterne[1]-.4,SC.sterne[1])));
  [...document.querySelectorAll('.st')].forEach((s,i)=>{
    const p=seg(t,3.1+i*.35,3.55+i*.35);
    s.style.opacity=Math.min(1,p*2);
    s.style.transform=`scale(${p<1?back(p):1})`;
  });
  const wp=ease(seg(t,3.1,5.0));
  $('#wert').textContent=(wp*5).toFixed(1).replace('.',',');
  $('#seit').style.opacity=ease(seg(t,5.4,5.9));

  /* 3: Danke */
  const danke=$('#danke');
  danke.style.opacity=ease(seg(t,SC.danke[0],SC.danke[0]+.5));
  danke.style.transform=`scale(${.96+.04*ease(seg(t,SC.danke[0],SC.danke[0]+.7))})`;
}
window.render=render;
</script>
</body>
</html>
